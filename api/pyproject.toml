[project]
name = "ams-api"
version = "0.1.0"
description = "Lightweight read API over AMS trace storage. Serves the dashboard; structured so a future MCP server reuses the same data layer."
requires-python = ">=3.10"
dependencies = [
    "ams-observability>=0.3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Local/dev: resolve ams-observability from the repo root (this api lives inside
# the ams repo). In a container, install the repo root too (`pip install ..`),
# or rely on the published >=0.3.0 from PyPI.
[tool.uv.sources]
ams-observability = { path = "..", editable = true }
