[project]
name = "ams-observability"
version = "0.3.0"
description = "A super simple monitoring system for Claude agents — full session traces as JSON in blob storage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mathu97" }]
keywords = ["claude", "agents", "observability", "monitoring", "tracing", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    # boto3 is a core dep because S3-compatible storage is the default
    # backend. LocalStorage (dev) doesn't use it, but the common path does.
    "boto3>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/mathu97/ams"
Repository = "https://github.com/mathu97/ams"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ams"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
