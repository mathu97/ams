[project]
name = "ams-monitor"
version = "0.1.0"
description = "A super simple monitoring system for Claude agents — full session traces as JSON in blob storage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mathu97" }]
keywords = ["claude", "agents", "observability", "monitoring", "tracing", "llm"]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.28"]
dev = [
    "boto3>=1.28",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/mathu97/ams"
Repository = "https://github.com/mathu97/ams"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ams"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
